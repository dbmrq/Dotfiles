# Neru Configuration - https://github.com/y3owk1n/neru
# Hotkeys managed by Hammerspoon (hyper+S → j/k=scroll, s=hints, g=grid, q=quadgrid)

[general]
excluded_apps = ["com.apple.Terminal", "com.googlecode.iterm2", "com.mitchellh.ghostty", "dev.warp.Warp-Stable"]
accessibility_check_on_start = true
mode_exit_keys = ["escape"]

[hints]
enabled = true
hint_characters = "asdfghjkl"
font_size = 12
border_radius = 4
padding = 4
opacity = 0.95
background_color = "#FFD700"
text_color = "#000000"
matched_text_color = "#737373"
border_color = "#000000"
clickable_roles = ["AXButton", "AXLink", "AXTextField", "AXCheckBox", "AXComboBox", "AXRadioButton", "AXPopUpButton", "AXSlider", "AXTabButton", "AXSwitch"]
mouse_action_refresh_delay = 1500

[grid]
enabled = true
characters = "asdfghjkl"
reset_key = ","
font_size = 12
opacity = 0.7
background_color = "#abe9b3"
text_color = "#000000"
matched_text_color = "#f8bd96"
border_color = "#abe9b3"
live_match_update = true
hide_unmatched = true

[quad_grid]
enabled = true
keys = "uijk"
min_size = 25
max_depth = 10
reset_key = ","
line_color = "#8EE2FF"
line_width = 1
highlight_color = "#00BFFF"
highlight_opacity = 0.3
label_color = "#FFFFFF"
label_font_size = 12

[scroll]
scroll_step = 50
scroll_step_half = 500
scroll_step_full = 1000000
font_size = 12
font_family = "SF Mono"
opacity = 0.95
background_color = "#FFD700"
text_color = "#000000"
border_color = "#000000"
border_width = 1
padding = 4
border_radius = 4
indicator_x_offset = 20
indicator_y_offset = 20

[scroll.key_bindings]
scroll_up = ["k", "Up"]
scroll_down = ["j", "Down"]
scroll_left = ["h", "Left"]
scroll_right = ["l", "Right"]
go_top = ["gg", "Cmd+Up"]
go_bottom = ["G", "Cmd+Down"]
page_up = ["Ctrl+U", "PageUp"]
page_down = ["Ctrl+D", "PageDown"]

[action]
move_mouse_step = 10

[action.key_bindings]
left_click = "Shift+Return"
right_click = "Shift+R"
middle_click = "Shift+M"
mouse_down = "Shift+I"
mouse_up = "Shift+U"
move_mouse_up = "Up"
move_mouse_down = "Down"
move_mouse_left = "Left"
move_mouse_right = "Right"

[smooth_cursor]
move_mouse_enabled = true
steps = 10
delay = 1

[systray]
enabled = false

[logging]
log_level = "info"
