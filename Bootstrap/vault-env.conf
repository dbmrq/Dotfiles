# Mapping of environment variables to Vaultwarden item names.
#
# Used by `vault.sh env` (and `vault.sh unlock`): each line exports the item's
# password field under the given variable name. Items live in the
# machines@abacate.top vault on the self-hosted Vaultwarden instance.
#
# Format: ENV_VAR=VAULT_ITEM_NAME
# Comments and blank lines are ignored.

# OpenCode / agent tooling
FIRECRAWL_API_KEY=FIRECRAWL_API_KEY
NVIDIA_API_KEY=NVIDIA_API_KEY
ABACATE_API_KEY=ABACATE_API_KEY
OPENROUTER_API_KEY=OPENROUTER_API_KEY
OPENCODE_GO_API_KEY=OPENCODE_GO_API_KEY

# GitHub CLI (also lets `gh` work without `gh auth login`)
GH_TOKEN=GITHUB_TOKEN
